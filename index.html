<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클사무관 시군구 지표</title>
<link rel="icon" href="assets/clerk.jpg">
<meta property="og:title" content="클사무관의 시군구 지표">
<meta property="og:image" content="assets/clerk-full.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#14275e; --paper:#f4f7fc; --card:#ffffff; --line:#dde2ec; --mute:#6b7488;
  --band:#eaf0ff; --hi:#1f55d6; --lo:#d9382a; --hi-bg:#eef3ff; --lo-bg:#fff1ef; --track:#e8ecf4;
  --text:#101936;
  --m1:#0f3ea8;--m2:#4a78d8;--m3:#9db8ee;--m4:#f1b4a8;--m5:#cf3a2b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);
  font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
  font-feature-settings:"tnum" 1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

.hd{background:#fff;border-bottom:1px solid var(--line)}
.hd-in{max-width:1480px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.brand img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--hi-bg);box-shadow:0 2px 8px rgba(20,39,94,.15)}
.brand b{display:block;font-size:24px;font-weight:800;letter-spacing:-.04em;color:var(--ink);line-height:1.1}
.brand b em{font-style:normal;color:var(--hi)}
.brand span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.hd .sub{margin-left:auto;color:var(--mute);font-size:13px}
.sample{background:#ffd75e;color:#4a3600;font-size:13px;font-weight:600;padding:8px 24px;text-align:center}

.wrap{max-width:1480px;margin:0 auto;padding:22px 24px 56px;display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:4px}
.rail h3{margin:18px 0 6px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:-.01em}
.rail h3:first-child{margin-top:0}
.rail button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 10px;margin:0;font-size:14px;color:var(--text);cursor:pointer;border-radius:0 8px 8px 0;line-height:1.35}
.rail button:hover{background:color-mix(in srgb,var(--hi) 8%,transparent)}
.rail button[aria-current="true"]{border-left-color:var(--hi);background:var(--hi-bg);font-weight:650}
.picker{display:none;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card-h{padding:22px 24px 16px}
.crumb{display:inline-block;font-size:13px;font-weight:650;color:var(--hi);background:var(--hi-bg);padding:3px 10px;border-radius:999px}
.card-h h2{margin:10px 0 10px;font-size:30px;line-height:1.2;font-weight:780;letter-spacing:-.035em}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none;color:var(--mute);font-size:13px}
.meta li{background:var(--paper);padding:2px 10px;border-radius:6px}
.meta li.dir{color:var(--text);font-weight:600}

.finder{padding:0 24px 16px}
.finder input{width:100%;max-width:340px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.found span{font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:5px 11px}
.found b{font-weight:700}.found em{font-style:normal;color:var(--mute)}

.panels{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 24px 24px;align-items:start}
.mappanel .mp{padding:12px 12px 14px}
.mappanel svg{width:100%;height:auto;max-height:520px;display:block}
.panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.panel>h3{margin:0;background:var(--band);color:var(--ink);text-align:center;padding:12px 10px;font-size:16px;font-weight:750;letter-spacing:-.02em;border-bottom:1px solid var(--line)}
.grp{padding:12px 12px 4px}
.grp h4{margin:0 0 8px;font-size:14px;font-weight:700}
.grp.top h4{color:var(--hi)} .grp.bot h4{color:var(--lo)}
.grp ol{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:46px 1fr auto;column-gap:8px;align-items:baseline;padding:9px 12px 8px;border-radius:10px;margin-bottom:6px;background:var(--paper);border-left:4px solid var(--hi)}
.bot .row{border-left-color:var(--lo)}
.rk{white-space:nowrap;font-size:13px;color:var(--mute);font-weight:600}
.nm{font-size:15px;overflow-wrap:anywhere;font-weight:650;letter-spacing:-.02em;min-width:0}
.val{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--hi)}
.bot .val{color:var(--lo)}
.val small{font-size:13px;font-weight:600;margin-left:2px;color:var(--mute)}
.gauge{grid-column:2/4;height:3px;background:var(--track);border-radius:3px;margin-top:6px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--hi);border-radius:3px}
.bot .gauge i{background:var(--lo)}
.tie{background:var(--lo-bg);border-radius:10px;padding:12px 14px;border-left:4px solid var(--lo);margin-bottom:6px}
.grp.top .tie{background:var(--hi-bg);border-left-color:var(--hi)}
.tie .big{font-size:22px;font-weight:800;color:var(--lo);letter-spacing:-.03em}
.grp.top .tie .big{color:var(--hi)}
.tie .big span{font-size:16px;font-weight:700;color:var(--text);margin-left:6px}
.tie p{margin:6px 0 0;font-size:13px;color:var(--mute);line-height:1.6}

details.all{border-top:1px solid var(--line);margin-top:auto}
details.all summary{cursor:pointer;padding:12px 16px;font-size:14px;font-weight:600;color:var(--hi);list-style:none}
details.all summary::-webkit-details-marker{display:none}
details.all summary::before{content:"＋ ";}
details.all[open] summary::before{content:"－ ";}
.full{list-style:none;margin:0;padding:0 8px 10px;max-height:380px;overflow:auto}
.full li{display:grid;grid-template-columns:42px 1fr 70px 1fr;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;font-size:14px}
.full li.hit{background:var(--hi-bg)}
.full .r{color:var(--mute);text-align:right;font-size:13px}
.full .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .v{text-align:right;font-weight:650}
.full .b{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.full .b i{display:block;height:100%;background:var(--hi);opacity:.55}

.mappanel path{stroke:var(--card);stroke-width:.35;vector-effect:non-scaling-stroke;stroke-width:.6px;cursor:pointer;transition:opacity .1s}
.mappanel path:hover,.mappanel path.sel{stroke:var(--ink);stroke-width:1.6px}
.m0{fill:var(--track)}.m1{fill:var(--m1)}.m2{fill:var(--m2)}.m3{fill:var(--m3)}.m4{fill:var(--m4)}.m5{fill:var(--m5)}
.legend span{white-space:nowrap}
.legend{flex-wrap:wrap;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:26px;height:10px;border-radius:2px}
.mapside{font-size:14px;margin-top:8px;padding:10px 12px;background:var(--paper);border-radius:10px;min-height:76px}
.mapside .big{font-size:22px;font-weight:780;letter-spacing:-.03em}
.mapside p{margin:6px 0;color:var(--mute)}

.card-f{background:var(--paper);border-top:1px solid var(--line);color:var(--ink);padding:14px 28px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 18px}
.card-f b{font-weight:700;margin-right:6px}
.card-f span{color:var(--mute)}

@media (max-width:1180px) and (min-width:901px){
  .panels{grid-template-columns:1fr 1fr}.mappanel{grid-column:1/-1}.mappanel svg{max-height:420px}
}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:16px 14px 40px;gap:0}
  .rail{display:none}.picker{display:block}
  .card-h{padding:20px 18px 14px}.card-h h2{font-size:24px}
  .finder{padding:0 18px 14px}
  .panels{grid-template-columns:1fr;padding:0 14px 18px}
  .card-f{padding:14px 18px}
  .hd-in{padding:12px 16px}.hd .sub{margin-left:0;width:100%}.brand img{width:46px;height:46px}.brand b{font-size:20px}
  .full li{grid-template-columns:38px 1fr 62px}.full .b{display:none}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a class="brand" href="./"><img src="assets/clerk.jpg" alt="클사무관" width="56" height="56">
    <div><b>클사무관<em>의</em> 시군구 지표</b><span>글로벌데스크 · 삶의 질 랭킹</span></div></a>
  <div class="sub" id="sub"></div>
</div></header>
<div id="sample"></div>
<main class="wrap">
  <nav class="rail" id="rail" aria-label="지표 목록"></nav>
  <section>
    <select class="picker" id="picker" aria-label="지표 선택"></select>
    <article class="card" id="card" aria-live="polite"></article>
  </section>
</main>

<script>
const S={d:null,ind:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("data/data.json").then(r=>r.json()).then(d=>{
  S.d=d;
  const first=d.themes[0].indicators[0].id;
  const h=decodeURIComponent(location.hash.slice(1));
  S.ind=findInd(h)?h:first;
  $("sub").textContent=`${d.meta.updated} 업데이트 · 시도 ${d.sidos?d.sidos.length:0}곳, 시군구 ${d.regions.length}곳`;
  if(d.meta.isSample) $("sample").innerHTML='<div class="sample">화면 확인용 샘플(난수)입니다. 실제 통계가 아닙니다.</div>';
  buildNav();
  render();
});
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));if(S.d&&findInd(h)){S.ind=h;buildNav();render()}});

function findInd(id){for(const t of S.d.themes)for(const i of t.indicators)if(i.id===id)return i;return null}
function themeOf(id){return S.d.themes.find(t=>t.indicators.some(i=>i.id===id))}

function buildNav(){
  $("rail").innerHTML=S.d.themes.map(t=>`<h3>${esc(t.name)}</h3>`+t.indicators.map(i=>
    `<button data-i="${i.id}" ${i.id===S.ind?'aria-current="true"':""}>${esc(i.name)}</button>`).join("")).join("");
  $("rail").querySelectorAll("button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.i});
  $("picker").innerHTML=S.d.themes.map(t=>`<optgroup label="${esc(t.name)}">`+t.indicators.map(i=>
    `<option value="${i.id}" ${i.id===S.ind?"selected":""}>${esc(i.name)}</option>`).join("")+"</optgroup>").join("");
  $("picker").onchange=e=>{location.hash=e.target.value};
}

/* 우수한 쪽이 앞(1위)이 되도록 정렬하고 공동순위(1,1,3)를 매긴다 */
function rankList(items,hib){
  const a=[...items].sort((x,y)=>hib?y.v-x.v:x.v-y.v);
  a.forEach((r,i)=>{r.rank=i>0&&a[i-1].v===r.v?a[i-1].rank:i+1});
  return a;
}
function decimals(vals){let m=0;for(const v of vals){const s=String(v);const k=s.indexOf(".");if(k>=0)m=Math.max(m,s.length-k-1)}return Math.min(m,2)}
function fmtFn(vals,unit){
  const dc=decimals(vals), short=unit&&unit.length<=2?unit:"";
  return v=>(Number(v)===0?"0":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:dc,maximumFractionDigits:dc}))+(short?`<small>${esc(short)}</small>`:"");
}
function plain(vals,unit){const f=fmtFn(vals,unit);return v=>f(v).replace(/<[^>]+>/g,"")}

/* 높은 순/낮은 순 3개. 동률이 3칸을 넘으면 '값 N곳'으로 묶는다 */
function pick(ordered,n=3){
  const groups=[];
  for(const it of ordered){const g=groups[groups.length-1];if(g&&g[0].v===it.v)g.push(it);else groups.push([it])}
  const out=[];let used=0;
  for(const g of groups){
    if(used>=n)break;
    if(g.length<=n-used){g.forEach(it=>out.push({one:it}));used+=g.length}
    else{out.push({tie:g});used=n}
  }
  return out;
}

function panel(title,items,info,nameOf,yearLabel){
  if(!items.length) return "";
  const hib=info.higherIsBetter;
  const best=rankList(items,hib);
  const vals=best.map(x=>x.v), fmt=fmtFn(vals,info.unit), pl=plain(vals,info.unit);
  const hiV=best[0].v, loV=best[best.length-1].v, span=Math.abs(hiV-loV)||1;
  const good=v=>Math.max(Math.abs(v-loV)/span,0.04);
  const worst=[...best].reverse();
  const rowHTML=(it)=>`<li class="row"><span class="rk">${it.rank}위</span><span class="nm">${esc(nameOf(it))}</span><span class="val">${fmt(it.v)}</span><span class="gauge"><i style="width:${(good(it.v)*100).toFixed(1)}%"></i></span></li>`;
  const grp=(cls,label,list)=>{
    const rows=pick(list).map(p=>p.one?rowHTML(p.one):
      `<li class="tie"><div class="big">${fmt(p.tie[0].v)}<span>${p.tie.length}곳</span></div><p>${p.tie.slice(0,12).map(x=>esc(nameOf(x))).join(" · ")}${p.tie.length>12?` 외 ${p.tie.length-12}곳`:""}</p></li>`).join("");
    return `<div class="grp ${cls}"><h4>${label}</h4><ol>${rows}</ol></div>`;
  };
  const all=best.map(it=>`<li data-k="${esc(nameOf(it))}"><span class="r">${it.rank}위</span><span class="n">${esc(nameOf(it))}</span><span class="v">${pl(it.v)}</span><span class="b"><i style="width:${(good(it.v)*100).toFixed(1)}%"></i></span></li>`).join("");
  return `<section class="panel"><h3>${title}</h3>${grp("top","상위 3",best)}${grp("bot","하위 3",worst)}
    <details class="all"><summary>전체 순위 보기 (${best.length}곳)</summary><ol class="full">${all}</ol></details></section>`;
}

function render(){
  const d=S.d, info=findInd(S.ind), th=themeOf(S.ind);
  const sv=(d.sidoValues&&d.sidoValues[S.ind])||{};
  const gv=d.values[S.ind]||{};
  const sidoItems=Object.entries(sv).filter(([,v])=>v!=null).map(([k,v])=>({k,v}));
  const sgItems=d.regions.filter(r=>gv[r.code]!=null).map(r=>({...r,k:r.code,v:gv[r.code]}));
  const sgName=r=>r.sido==="세종"?"세종":`${r.sido} ${r.name}`;
  const sidoName=r=>r.k;

  const meta=[`단위 ${info.unit}`,
    info.yearSido?`광역 ${info.yearSido}`:null,
    info.yearSigungu?`기초 ${info.yearSigungu}`:(info.year?`기초 ${info.year}`:null)].filter(Boolean)
    .map(t=>`<li>${esc(t)}</li>`).join("")+`<li class="dir">${info.higherIsBetter?"높을수록 좋음":"낮을수록 좋음"}</li><li>순위는 좋은 쪽이 1위</li>`;

  $("card").innerHTML=`
    <div class="card-h"><span class="crumb">${esc(th.name)}</span><h2>${esc(info.name)}</h2><ul class="meta">${meta}</ul></div>
    <div class="finder"><input id="q" type="search" placeholder="지역 이름으로 순위 찾기" aria-label="지역 검색"><div class="found" id="found"></div></div>
    <div class="panels">
      <section class="panel mappanel"><h3>지도</h3><div class="mp"><div id="map"></div><div class="mapside" id="mapside"></div></div></section>
      ${panel(`광역 ${sidoItems.length}개 시도`,sidoItems,info,sidoName)}
      ${panel(`기초 ${sgItems.length}개 시군구`,sgItems,info,sgName)}
    </div>
    <div class="card-f"><span><b>출처</b>${esc(info.source||"-")}</span>${info.note?`<span>${esc(info.note)}</span>`:""}</div>`;

  drawMap(sgItems.length?sgItems:null,sidoItems,info,sgName);

  const rs=rankList(sgItems,info.higherIsBetter), rsido=rankList(sidoItems,info.higherIsBetter);
  const pl=plain(rs.map(x=>x.v),info.unit), plS=plain(rsido.map(x=>x.v),info.unit);
  $("q").oninput=e=>{
    const q=e.target.value.trim().replace(/\s+/g," ");
    document.querySelectorAll(".full li.hit").forEach(li=>li.classList.remove("hit"));
    if(!q){$("found").innerHTML="";return}
    const hits=[
      ...rsido.filter(r=>r.k.includes(q)).map(r=>`<span><b>${esc(r.k)}</b> 시도 ${r.rank}위/${rsido.length} <em>${plS(r.v)}</em></span>`),
      ...rs.filter(r=>sgName(r).includes(q)||r.name.includes(q)).slice(0,6).map(r=>`<span><b>${esc(sgName(r))}</b> ${r.rank}위/${rs.length} <em>${pl(r.v)}</em></span>`)
    ];
    $("found").innerHTML=hits.length?hits.join(""):'<span>일치하는 지역이 없어요.</span>';
    const names=new Set(rs.filter(r=>sgName(r).includes(q)||r.name.includes(q)).map(sgName));
    document.querySelectorAll(".panel:last-child .full li").forEach(li=>{if(names.has(li.dataset.k))li.classList.add("hit")});
  };
}

/* ---- 지도 (시군구 단계구분도) ---- */
const GEO={};
async function geo(kind){
  if(!GEO[kind]){
    const g=await fetch(`data/geo_${kind}.json`).then(r=>r.json());
    const LON0=124.5,LAT1=38.7,KX=0.8*100,KY=100;
    const pt=([x,y])=>`${((x-LON0)*KX).toFixed(1)} ${((LAT1-y)*KY).toFixed(1)}`;
    const ring=r=>"M"+r.map(pt).join("L")+"Z";
    GEO[kind]=g.features.map(f=>{
      const polys=f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates;
      return {k:f.properties.k,d:polys.map(p=>p.map(ring).join("")).join("")};
    });
  }
  return GEO[kind];
}
let MAPSEQ=0;
async function drawMap(sgItems,sidoItems,info,sgName){
  const seq=++MAPSEQ, useSg=!!sgItems;
  const items=useSg?sgItems:sidoItems;
  const el=$("map");
  if(!items.length){el.innerHTML="";return}
  let paths; try{paths=await geo(useSg?"sigungu":"sido")}catch(e){el.innerHTML='<p class="hint">지도를 불러오지 못했어요.</p>';return}
  if(seq!==MAPSEQ) return;
  const ranked=rankList(items,info.higherIsBetter), n=ranked.length;
  const keyOf=r=>useSg?r.k:r.k, byKey=new Map(ranked.map(r=>[keyOf(r),r]));
  const pl=plain(ranked.map(x=>x.v),info.unit);
  const cls=r=>{ // 순위 백분위로 5단계 (동률은 같은 단계)
    const q=(r.rank-1)/Math.max(n,1); return "m"+(1+Math.min(4,Math.floor(q*5)));
  };
  const label=k=>{const r=byKey.get(k);return useSg&&r?sgName(r):k};
  el.innerHTML=`<svg viewBox="0 0 ${(131.9-124.5)*80+4} ${(38.7-33.0)*100+4}" role="img" aria-label="${esc(info.name)} 지도">`+
    paths.map(p=>{const r=byKey.get(p.k);return `<path d="${p.d}" class="${r?cls(r):"m0"}" data-k="${esc(p.k)}"><title>${esc(label(p.k))}${r?` ${r.rank}위 ${pl(r.v)}`:" 자료 없음"}</title></path>`}).join("")+`</svg>
    <div class="legend"><span>좋음</span><i class="m1" style="background:var(--m1)"></i><i style="background:var(--m2)"></i><i style="background:var(--m3)"></i><i style="background:var(--m4)"></i><i style="background:var(--m5)"></i><span>나쁨</span><i style="background:var(--track)"></i><span>자료 없음</span></div>`;
  const side=$("mapside");
  const show=k=>{
    const r=byKey.get(k);
    side.innerHTML=r?`<div class="big">${esc(label(k))}</div><p>${n}곳 중 <b>${r.rank}위</b></p><div class="big">${pl(r.v)}</div><p>${info.unit&&info.unit.length>2?esc(info.unit):""}</p>`
      :`<div class="big">${esc(label(k))}</div><p>이 지표는 자료가 없어요.</p>`;
    el.querySelectorAll("path.sel").forEach(x=>x.classList.remove("sel"));
    const t=[...el.querySelectorAll("path")].find(x=>x.dataset.k===k); if(t) t.classList.add("sel");
  };
  el.querySelectorAll("path").forEach(p=>{p.onmouseenter=()=>show(p.dataset.k);p.onclick=()=>show(p.dataset.k)});
  side.innerHTML=`<p>${useSg?"시군구":"시도"} 단위 지도입니다. ${useSg?"":"이 지표는 시도 단위만 공표돼요. "}지역을 눌러보세요.</p>`;
}
</script>
</body>
</html>
