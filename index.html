<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클사무관의 라이프 인덱스</title>
<link rel="icon" href="assets/clerk.jpg">
<meta property="og:title" content="클사무관의 라이프 인덱스">
<meta property="og:image" content="assets/clerk-full.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#14275e; --paper:#f4f7fc; --card:#ffffff; --line:#dde2ec; --mute:#6b7488;
  --band:#eaf0ff; --hi:#1f55d6; --lo:#d9382a; --hi-bg:#eef3ff; --lo-bg:#fff1ef; --track:#e8ecf4;
  --text:#101936;
  --m1:#0f3ea8;--m2:#4a78d8;--m3:#9db8ee;--m4:#f1b4a8;--m5:#cf3a2b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);
  font:16.5px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
  font-feature-settings:"tnum" 1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

.hd{background:#fff;border-bottom:1px solid var(--line)}
.hd-in{max-width:1640px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.brand img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--hi-bg);box-shadow:0 2px 8px rgba(20,39,94,.15)}
.brand b{display:block;font-size:27px;font-weight:800;letter-spacing:-.04em;color:var(--ink);line-height:1.1}
.brand b em{font-style:normal;color:var(--hi)}
.brand span{display:block;font-size:13.5px;color:var(--mute);margin-top:2px}
.hd .sub{margin-left:auto;color:var(--mute);font-size:14.5px}
.sample{background:#ffd75e;color:#4a3600;font-size:13px;font-weight:600;padding:8px 24px;text-align:center}

.wrap{max-width:1640px;margin:0 auto;padding:22px 24px 56px;display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:4px}
.rail h3{margin:24px 0 6px;padding:0 10px;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.rail h3 i{font-style:normal;color:var(--hi);margin-right:4px}
.rail h3.lab{margin-top:30px;padding-top:14px;border-top:1px dashed var(--line);color:var(--mute)}
.rail h3:first-child{margin-top:0}
.rail button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:8px 10px;margin:0;font-size:15.5px;color:var(--text);cursor:pointer;border-radius:0 8px 8px 0;line-height:1.35}
.rail button:hover{background:color-mix(in srgb,var(--hi) 8%,transparent)}
.rail button[aria-current="true"]{border-left-color:var(--hi);background:var(--hi-bg);font-weight:650}
.picker{display:none;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card-h{padding:22px 24px 16px}
.crumb{display:inline-block;font-size:14.5px;font-weight:650;color:var(--hi);background:var(--hi-bg);padding:3px 10px;border-radius:999px}
.card-h h2{margin:10px 0 12px;font-size:34px;line-height:1.2;font-weight:780;letter-spacing:-.035em}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none;color:var(--mute);font-size:14.5px}
.meta li{background:var(--paper);padding:2px 10px;border-radius:6px}
.meta li.dir{color:var(--text);font-weight:600}

.finder{padding:0 24px 16px}
.finder input{width:100%;max-width:340px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.found span{font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:5px 11px}
.found b{font-weight:700}.found em{font-style:normal;color:var(--mute)}

.panels{display:grid;grid-template-columns:minmax(340px,1.45fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 24px 24px;align-items:start}
.mappanel .mp{padding:12px 12px 14px}
.mappanel .mp{padding:6px 6px 12px}
.mappanel svg{width:100%;height:auto;max-height:82vh;display:block;margin:0 auto}
.panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.panel>h3{margin:0;background:var(--band);color:var(--ink);text-align:center;padding:13px 10px;font-size:18px;font-weight:750;letter-spacing:-.02em;border-bottom:1px solid var(--line)}
.grp{padding:12px 12px 4px}
.grp h4{margin:0 0 8px;font-size:15.5px;font-weight:700}
.grp.top h4{color:var(--hi)} .grp.bot h4{color:var(--lo)}
.grp ol{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:46px 1fr auto;column-gap:8px;align-items:baseline;padding:9px 12px 8px;border-radius:10px;margin-bottom:6px;background:var(--paper);border-left:4px solid var(--hi)}
.bot .row{border-left-color:var(--lo)}
.rk{white-space:nowrap;font-size:14px;color:var(--mute);font-weight:600}
.nm{font-size:16.5px;overflow-wrap:anywhere;font-weight:650;letter-spacing:-.02em;min-width:0}
.val{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--hi)}
.bot .val{color:var(--lo)}
.val small{font-size:13px;font-weight:600;margin-left:2px;color:var(--mute)}
.gauge{grid-column:2/4;height:3px;background:var(--track);border-radius:3px;margin-top:6px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--hi);border-radius:3px}
.bot .gauge i{background:var(--lo)}
.tie{background:var(--lo-bg);border-radius:10px;padding:12px 14px;border-left:4px solid var(--lo);margin-bottom:6px}
.grp.top .tie{background:var(--hi-bg);border-left-color:var(--hi)}
.tie .big{font-size:22px;font-weight:800;color:var(--lo);letter-spacing:-.03em}
.grp.top .tie .big{color:var(--hi)}
.tie .big span{font-size:16px;font-weight:700;color:var(--text);margin-left:6px}
.tie p{margin:6px 0 0;font-size:14.5px;color:var(--mute);line-height:1.6}

details.all{border-top:1px solid var(--line);margin-top:auto}
details.all summary{cursor:pointer;padding:12px 16px;font-size:15.5px;font-weight:600;color:var(--hi);list-style:none}
details.all summary::-webkit-details-marker{display:none}
details.all summary::before{content:"＋ ";}
details.all[open] summary::before{content:"－ ";}
.full{list-style:none;margin:0;padding:0 8px 10px;max-height:380px;overflow:auto}
.full li{display:grid;grid-template-columns:42px 1fr 70px 1fr;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;font-size:15px}
.full li.hit{background:var(--hi-bg)}
.full .r{color:var(--mute);text-align:right;font-size:13px}
.full .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .v{text-align:right;font-weight:650}
.full .b{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.full .b i{display:block;height:100%;background:var(--hi);opacity:.55}

.mappanel path{stroke:var(--card);stroke-width:.35;vector-effect:non-scaling-stroke;stroke-width:.6px;cursor:pointer;transition:opacity .1s}
.mappanel path:hover,.mappanel path.sel{stroke:var(--ink);stroke-width:1.6px}
.m0{fill:var(--track)}.m1{fill:var(--m1)}.m2{fill:var(--m2)}.m3{fill:var(--m3)}.m4{fill:var(--m4)}.m5{fill:var(--m5)}
.legend span{white-space:nowrap}
.legend{flex-wrap:wrap;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:26px;height:10px;border-radius:2px}
.mapside{font-size:15.5px;margin-top:8px;padding:10px 12px;background:var(--paper);border-radius:10px;min-height:76px}
.mapside .big{font-size:22px;font-weight:780;letter-spacing:-.03em}
.mapside p{margin:6px 0;color:var(--mute)}

.qctl{margin:0 24px 16px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--paper)}
.qctl h3{margin:0 0 4px;font-size:15px;font-weight:750}
.qctl p{margin:0 0 12px;color:var(--mute);font-size:14.5px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 22px}
.qgrid label{display:block;font-size:15px}
.qgrid label b{font-weight:650}.qgrid label em{font-style:normal;color:var(--hi);font-weight:700;float:right}
.qgrid small{display:block;color:var(--mute);font-size:13.5px}
.qgrid input[type=range]{width:100%;accent-color:var(--hi)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;font-size:13px}
.qrow select,.qrow button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.method{margin:0 24px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.method summary{cursor:pointer;padding:14px 18px;font-weight:700;color:var(--hi);list-style:none}
.method summary::-webkit-details-marker{display:none}
.method .mb{padding:0 18px 16px;font-size:14px;color:var(--text)}
.method table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
.method th,.method td{border-top:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.method th{color:var(--mute);font-weight:650;background:var(--paper)}
.method ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.method a{color:var(--hi)}

.frow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.frow input{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:9px 16px;font-size:15px;cursor:pointer;color:var(--text)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--hi);color:#fff;font-weight:650}
.peerhint{margin:8px 0 0;font-size:14px;color:var(--mute)}

.home{padding:30px 32px 34px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--hi-bg);box-shadow:0 4px 14px rgba(20,39,94,.15)}
.hero h2{margin:0 0 8px;font-size:36px;line-height:1.25;font-weight:800;letter-spacing:-.04em}
.hero h2 em{font-style:normal;color:var(--hi)}
.hero p{margin:0;color:var(--mute);font-size:17.5px;max-width:760px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 22px}
.stats div{background:var(--hi-bg);border-radius:14px;padding:14px 16px}
.stats b{display:block;font-size:36px;font-weight:800;color:var(--hi);letter-spacing:-.03em;line-height:1.1}
.stats span{font-size:15px;color:var(--mute)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 26px;padding:0;list-style:none;counter-reset:h}
.how li{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;counter-increment:h}
.how li::before{content:counter(h);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--hi);color:#fff;font-size:12px;font-weight:700;margin-right:8px}
.home h3.sec{font-size:22px;font-weight:800;margin:0 0 12px;letter-spacing:-.02em}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card)}
.tcard h4{margin:0 0 10px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.tcard h4 i{font-style:normal;color:var(--hi);margin-right:4px}
.tcard h4 small{font-size:14px;font-weight:600;color:var(--mute);margin-left:6px}
.tcard.lab{background:var(--paper);border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{font-size:15.5px;text-decoration:none;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 13px;line-height:1.3}
.chips a:hover{border-color:var(--hi);color:var(--hi)}
.srcs{margin-top:26px;font-size:14.5px;color:var(--mute)}
.srcs b{color:var(--text)}
.mnav{display:none;margin-bottom:10px}
.mnav a{display:inline-block;font-size:14px;font-weight:650;color:var(--hi);text-decoration:none;padding:6px 2px}
.rail .home-link{display:block;font-size:15.5px;font-weight:700;color:var(--hi);text-decoration:none;padding:4px 10px 0}

.topnav{margin-left:auto;display:flex;gap:6px}
.topnav a{text-decoration:none;color:var(--ink);font-size:16px;font-weight:650;padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);transition:background .15s,border-color .15s}
.topnav a:hover{border-color:var(--hi);color:var(--hi)}
.topnav a[aria-current="page"]{background:var(--hi);border-color:var(--hi);color:#fff}

.mpick{display:none;position:relative;margin-bottom:12px}
#mpbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;font-weight:600;text-align:left;cursor:pointer}
#mpbtn i{font-style:normal;color:var(--mute);font-size:11px}
#mplist{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:65vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,39,94,.18);padding:6px 10px 10px}
#mplist h5{margin:10px 0 4px;font-size:12.5px;font-weight:800;color:var(--ink)}
#mplist div{display:flex;flex-wrap:wrap;gap:4px}
#mplist a{font-size:12px;line-height:1.3;text-decoration:none;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
#mplist a[aria-current="true"]{background:var(--hi);border-color:var(--hi);color:#fff}

.qwrap{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:24px;align-items:center}
#radar{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#radar .rg{fill:none;stroke:var(--line);stroke-width:1}
#radar .rg5{stroke:#b9c3d9;stroke-width:1.5;fill:var(--card)}
#radar .ax{stroke:var(--line);stroke-width:1}
#radar .tk{font-size:11px;fill:var(--mute)}
#radar .rp{fill:color-mix(in srgb,var(--hi) 22%,transparent);stroke:var(--hi);stroke-width:2.5;stroke-linejoin:round}
#radar .hd{fill:#fff;stroke:var(--hi);stroke-width:3}
#radar .hd.on{fill:var(--hi);r:12}
#radar .lb{font-size:18px;font-weight:700;fill:var(--ink)}
#radar .lv{font-size:19px;font-weight:800;fill:var(--hi)}
.qlist{list-style:none;margin:0 0 6px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.qlist li{display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:14.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.qlist li span{grid-row:2;color:var(--mute);font-size:12.5px}
.qlist li em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:800;font-size:20px;color:var(--hi)}
.qwarn{margin-top:12px!important;font-size:13.5px!important}

.notice{margin:0 24px 16px;padding:14px 18px;border:1px solid #f0c36d;background:#fff8e6;border-radius:12px;color:#5c4300}
.notice b{font-size:16px}
.notice ul{margin:6px 0 0;padding-left:20px;font-size:14.5px;line-height:1.65}

.mapbox2{position:relative}
.mapbox2 svg.zoomed{cursor:grab}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 2px 8px rgba(20,39,94,.12)}
.zoom button{width:40px;height:40px;border:0;background:var(--card);font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button[data-z="reset"]{font-size:18px}
.zoom button:hover{background:var(--hi-bg);color:var(--hi)}
.zhint{position:absolute;left:8px;bottom:4px;margin:0;font-size:12.5px;color:var(--mute);background:color-mix(in srgb,var(--card) 85%,transparent);padding:2px 8px;border-radius:6px;pointer-events:none}
.zhint:empty{display:none}

.mtip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:14px;line-height:1.45;box-shadow:0 6px 18px rgba(20,39,94,.25);white-space:nowrap}
.mtip b{display:block;font-size:15.5px}
.mtip span{display:block;color:#d6def3}
.mtip small{color:#aab6d6;font-size:12px}
.mtip .tv{color:#fff;font-weight:700}

.card-f{background:var(--paper);border-top:1px solid var(--line);color:var(--ink);padding:14px 28px;font-size:14.5px;display:flex;flex-wrap:wrap;gap:4px 18px}
.card-f b{font-weight:700;margin-right:6px}
.card-f span{color:var(--mute)}

@media (max-width:1180px) and (min-width:901px){
  .panels{grid-template-columns:1fr 1fr}.mappanel{grid-column:1/-1}.mappanel svg{max-height:640px}
}
@media (max-width:900px){
  .notice{margin:0 12px 12px;padding:11px 13px}.notice b{font-size:14.5px}.notice ul{font-size:13px;padding-left:17px}
  .qctl{margin:0 12px 14px;padding:12px}.qwrap{grid-template-columns:1fr;gap:10px}.qlist{grid-template-columns:1fr 1fr;gap:2px 12px}.qlist li{font-size:13px}.qlist li span{display:none}.qlist li em{font-size:16px}.qlist{display:none}
  #radar .lb,#radar .lv{font-size:22px}#radar .tk{font-size:14px}#radar .hd{r:12}
  .topnav{margin-left:0;width:100%}.topnav a{flex:1;text-align:center;padding:8px 6px;font-size:15px}
  .tb{display:grid;grid-template-columns:1fr 1fr}
  .tb .grp{padding:10px 6px 2px}.tb .grp.top{padding-left:10px}.tb .grp.bot{padding-right:10px;border-left:1px dashed var(--line)}
  .tb .grp h4{font-size:14px;margin-bottom:6px}
  .tb .row{grid-template-columns:auto 1fr;column-gap:6px;padding:7px 8px;margin-bottom:5px;border-left-width:3px}
  .tb .rk{font-size:12px}.tb .nm{font-size:14px;line-height:1.3}
  .tb .val{grid-column:1/3;font-size:19px;margin-top:2px}.tb .val small{font-size:11.5px}
  .tb .gauge{grid-column:1/3;margin-top:4px}
  .tb .tie{padding:8px 9px;border-left-width:3px}.tb .tie .big{font-size:19px}.tb .tie .big span{font-size:13px}.tb .tie p{font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .panel>h3{font-size:16px;padding:10px}
  .wrap{grid-template-columns:1fr;padding:16px 14px 40px;gap:0}
  .rail{display:none}.picker{display:none}.mpick{display:block}.mnav{display:block}
  .home{padding:22px 18px 24px}.hero img{width:72px;height:72px}.hero h2{font-size:24px}
  .stats{grid-template-columns:repeat(2,1fr)}.how{grid-template-columns:1fr}.tcards{grid-template-columns:1fr}
  .card-h{padding:20px 18px 14px}.card-h h2{font-size:24px}
  .finder{padding:0 18px 14px}
  .panels{grid-template-columns:1fr;padding:0 14px 18px}
  .card-f{padding:14px 18px}
  .hd-in{padding:12px 16px}.hd .sub{margin-left:0;width:100%}.brand img{width:46px;height:46px}.brand b{font-size:20px}
  .full li{grid-template-columns:38px 1fr 62px}.full .b{display:none}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a class="brand" href="./"><img src="assets/clerk.jpg" alt="클사무관" width="56" height="56">
    <div><b>클사무관의 <em>라이프 인덱스</em></b><span id="sub"></span></div></a>
  <nav class="topnav" aria-label="주 메뉴"><a id="tn-home" href="#">홈</a><a id="tn-ind" href="#aging">지표</a><a id="tn-lab" href="#qol">🧪 실험실</a></nav>
</div></header>
<div id="sample"></div>
<main class="wrap">
  <nav class="rail" id="rail" aria-label="지표 목록"></nav>

<script>
const S={d:null,ind:null,peer:"all"};
const PEERS=[["all","전체"],["구","자치구"],["시","시"],["군","군"]];
const typeOf=r=>r.name=="세종"?"시":r.name.slice(-1)==="구"?"구":r.name.slice(-1)==="군"?"군":"시";
const peerOk=r=>S.peer==="all"||typeOf(r)===S.peer;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("data/data.json").then(r=>r.json()).then(async d=>{
  S.d=d;
  try{const pr=localStorage.getItem("lifestats-peer");if(pr&&PEERS.some(x=>x[0]===pr))S.peer=pr}catch(e){}
  try{S.cfg=await fetch("data/qol_config.json").then(r=>r.json());setupQol()}catch(e){S.cfg=null}
  const h=decodeURIComponent(location.hash.slice(1));
  S.ind=findInd(h)?h:null;
  $("sub").textContent=`${d.meta.updated} 업데이트 · 매주 자동 갱신`;
  if(d.meta.isSample) $("sample").innerHTML='<div class="sample">화면 확인용 샘플(난수)입니다. 실제 통계가 아닙니다.</div>';
  buildNav();
  render();
});
window.addEventListener("hashchange",()=>{if(!S.d)return;const h=decodeURIComponent(location.hash.slice(1));S.ind=findInd(h)?h:null;buildNav();render();window.scrollTo(0,0)});

function findInd(id){for(const t of S.d.themes)for(const i of t.indicators)if(i.id===id)return i;return null}
function themeOf(id){return S.d.themes.find(t=>t.indicators.some(i=>i.id===id))}

function buildNav(){
  let n=0;
  $("rail").innerHTML=`<a class="home-link" href="#">← 처음 화면</a>`+S.d.themes.map(t=>(t.id==="qol"?`<h3 class="lab">🧪 ${esc(t.name.replace("실험실 · ",""))} <small>실험실</small></h3>`:`<h3><i>${++n}.</i> ${esc(t.name)}</h3>`)+t.indicators.map(i=>
    `<button data-i="${i.id}" ${i.id===S.ind?'aria-current="true"':""}>${esc(i.name)}</button>`).join("")).join("");
  $("rail").querySelectorAll("button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.i});
  $("picker").innerHTML=`<option value="" ${S.ind?"":"selected"}>지표를 골라 보세요 (전체 ${S.d.themes.reduce((a,t)=>a+(t.id==="qol"?0:t.indicators.length),0)}개)</option>`+S.d.themes.map(t=>`<optgroup label="${esc(t.id==="qol"?"🧪 "+t.name:(S.d.themes.filter(x=>x.id!=="qol").indexOf(t)+1)+". "+t.name)}">`+t.indicators.map(i=>
    `<option value="${i.id}" ${i.id===S.ind?"selected":""}>${esc(i.name)}</option>`).join("")+"</optgroup>").join("");
  $("picker").onchange=e=>{location.hash=e.target.value};
  // 모바일용 지표 선택(네이티브 드롭다운 대신 작은 글씨 목록)
  {let k=0;const cur=S.ind?findInd(S.ind):null;
   $("mpbtn").innerHTML=`<span>${cur?esc(cur.name):"지표를 골라 보세요"}</span><i>▾</i>`;
   $("mplist").innerHTML=S.d.themes.map(t=>`<h5>${t.id==="qol"?"🧪 실험실":(++k)+". "+esc(t.name)}</h5><div>${t.indicators.map(i=>`<a href="#${i.id}" ${i.id===S.ind?'aria-current="true"':""}>${esc(i.name)}</a>`).join("")}</div>`).join("");
   const close=()=>{$("mplist").hidden=true;$("mpbtn").setAttribute("aria-expanded","false")};
   $("mpbtn").onclick=e=>{e.stopPropagation();const o=$("mplist").hidden;$("mplist").hidden=!o;$("mpbtn").setAttribute("aria-expanded",String(o))};
   $("mplist").querySelectorAll("a").forEach(x=>x.onclick=close);
   document.onclick=e=>{if(!e.target.closest(".mpick"))close()};}
  $("mnav").innerHTML=S.ind?'<a href="#">☰ 전체 지표 메뉴 보기</a>':"";
  const lab=S.ind&&S.ind.startsWith("qol");
  if(S.ind&&!lab)S.last=S.ind;
  const firstInd=S.d.themes.find(t=>t.id!=="qol").indicators[0].id;
  $("tn-ind").href="#"+(S.last||firstInd);
  [["tn-home",!S.ind],["tn-ind",S.ind&&!lab],["tn-lab",lab]].forEach(([id,on])=>on?$(id).setAttribute("aria-current","page"):$(id).removeAttribute("aria-current"));
}

/* 우수한 쪽이 앞(1위)이 되도록 정렬하고 공동순위(1,1,3)를 매긴다 */
function rankList(items,hib){
  const a=[...items].sort((x,y)=>hib?y.v-x.v:x.v-y.v);
  a.forEach((r,i)=>{r.rank=i>0&&a[i-1].v===r.v?a[i-1].rank:i+1});
  return a;
}
function decimals(vals){let m=0;for(const v of vals){const s=String(v);const k=s.indexOf(".");if(k>=0)m=Math.max(m,s.length-k-1)}return Math.min(m,2)}
function fmtFn(vals,unit){
  const dc=decimals(vals), short=unit&&unit.length<=2?unit:"";
  return v=>(Number(v)===0?"0":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:dc,maximumFractionDigits:dc}))+(short?`<small>${esc(short)}</small>`:"");
}
function plain(vals,unit){const f=fmtFn(vals,unit);return v=>f(v).replace(/<[^>]+>/g,"")}

/* 높은 순/낮은 순 3개. 동률이 3칸을 넘으면 '값 N곳'으로 묶는다 */
function pick(ordered,n=3){
  const groups=[];
  for(const it of ordered){const g=groups[groups.length-1];if(g&&g[0].v===it.v)g.push(it);else groups.push([it])}
  const out=[];let used=0;
  for(const g of groups){
    if(used>=n)break;
    if(g.length<=n-used){g.forEach(it=>out.push({one:it}));used+=g.length}
    else{out.push({tie:g});used=n}
  }
  return out;
}

function panel(title,items,info,nameOf,yearLabel){
  if(!items.length) return "";
  const hib=info.higherIsBetter;
  const best=rankList(items,hib);
  const vals=best.map(x=>x.v), fmt=fmtFn(vals,info.unit), pl=plain(vals,info.unit);
  const hiV=best[0].v, loV=best[best.length-1].v, span=Math.abs(hiV-loV)||1;
  const good=v=>Math.max(Math.abs(v-loV)/span,0.04);
  const worst=[...best].reverse();
  const rowHTML=(it)=>`<li class="row"><span class="rk">${it.rank}위</span><span class="nm">${esc(nameOf(it))}</span><span class="val">${fmt(it.v)}</span><span class="gauge"><i style="width:${(good(it.v)*100).toFixed(1)}%"></i></span></li>`;
  const grp=(cls,label,list)=>{
    const rows=pick(list).map(p=>p.one?rowHTML(p.one):
      `<li class="tie"><div class="big">${fmt(p.tie[0].v)}<span>${p.tie.length}곳</span></div><p>${p.tie.slice(0,12).map(x=>esc(nameOf(x))).join(" · ")}${p.tie.length>12?` 외 ${p.tie.length-12}곳`:""}</p></li>`).join("");
    return `<div class="grp ${cls}"><h4>${label}</h4><ol>${rows}</ol></div>`;
  };
  const all=best.map(it=>`<li data-k="${esc(nameOf(it))}"><span class="r">${it.rank}위</span><span class="n">${esc(nameOf(it))}</span><span class="v">${pl(it.v)}</span><span class="b"><i style="width:${(good(it.v)*100).toFixed(1)}%"></i></span></li>`).join("");
  return `<section class="panel"><h3>${title}</h3><div class="tb">${grp("top","상위 3",best)}${grp("bot","하위 3",worst)}</div>
    <details class="all"><summary>전체 순위 보기 (${best.length}곳)</summary><ol class="full">${all}</ol></details></section>`;
}

  const d=S.d, th=d.themes.filter(t=>t.id!=="qol"), lab=d.themes.find(t=>t.id==="qol");
  const nInd=th.reduce((a,t)=>a+t.indicators.length,0);
  const sg=th.flatMap(t=>t.indicators).filter(i=>i.yearSigungu).length;
  const srcs=[...new Set(th.flatMap(t=>t.indicators.map(i=>(i.source||"").replace(/\(.*?\)/g,"").trim())).filter(Boolean))];
  const chip=i=>`<a href="#${i.id}">${esc(i.name)}</a>`;
  $("card").innerHTML=`<div class="home">
    <div class="hero"><img src="assets/clerk.jpg" alt="클사무관"><div>
      <h2>우리 동네 삶의 질,<br><em>${th.length}개 분야 ${nInd}개 지표</em>로 비교해 보세요</h2>
      <p>클사무관의 라이프 인덱스는 국가데이터처(KOSIS) 등 공식 통계를 모아 광역 17개 시도와 기초 ${d.regions.length}개 시군구의 순위를 한눈에 보여줍니다. 지표를 고르면 상위·하위 3곳과 지도가 바로 나옵니다.</p></div></div>
    <div class="stats"><div><b>${th.length}</b><span>분야</span></div><div><b>${nInd}</b><span>지표 (시군구 비교 ${sg}개)</span></div><div><b>${d.sidos.length}</b><span>광역 시도</span></div><div><b>${d.regions.length}</b><span>기초 시군구</span></div></div>
    <ol class="how"><li>아래에서 분야와 지표를 고릅니다</li><li>광역·기초 상위 3, 하위 3과 지도를 봅니다</li><li>지역 이름을 검색하거나 군·시·자치구끼리 비교합니다</li></ol>
    <h3 class="sec">분야별 지표</h3>
    <div class="tcards">${th.map((t,k)=>`<div class="tcard"><h4><i>${k+1}.</i>${esc(t.name)}<small>${t.indicators.length}개</small></h4><div class="chips">${t.indicators.map(chip).join("")}</div></div>`).join("")}
    ${lab?`<div class="tcard lab"><h4>🧪 실험실<small>종합 지수</small></h4><p style="margin:0 0 8px;font-size:13px;color:var(--mute)">⚠️ 비공식 실험 지수. 해외 사례를 참고해 분야별 점수를 합쳤고, 가중치에 따라 결과가 크게 바뀝니다. 정책 모델링·토론용 참고자료로만 써 주세요.</p><div class="chips">${chip(lab.indicators[0])}</div></div>`:""}</div>
    <p class="srcs"><b>출처</b> ${srcs.map(esc).join(" · ")} · ${esc(d.meta.updated)} 업데이트(매주 자동 갱신)</p>
  </div>`;
}

function render(){
  if(!S.ind){renderHome();return}
  const d=S.d, info=findInd(S.ind), th=themeOf(S.ind);
  const sv=(d.sidoValues&&d.sidoValues[S.ind])||{};
  const gv=d.values[S.ind]||{};
  const sidoItems=Object.entries(sv).filter(([,v])=>v!=null).map(([k,v])=>({k,v}));
  const sgItems=d.regions.filter(r=>gv[r.code]!=null&&peerOk(r)).map(r=>({...r,k:r.code,v:gv[r.code]}));
  const sgName=r=>r.sido==="세종"?"세종":`${r.sido} ${r.name}`;
  const sidoName=r=>r.k;

  const meta=[`단위 ${info.unit}`,
    info.yearSido?`광역 ${info.yearSido}`:null,
    info.yearSigungu?`기초 ${info.yearSigungu}`:(info.year?`기초 ${info.year}`:null)].filter(Boolean)
    .map(t=>`<li>${esc(t)}</li>`).join("")+`<li class="dir">${info.higherIsBetter?"높을수록 좋음":"낮을수록 좋음"}</li><li>순위는 좋은 쪽이 1위</li>`;

  $("card").innerHTML=`
    <div class="card-h"><span class="crumb">${esc(th.name)}</span><h2>${esc(info.name)}</h2><ul class="meta">${meta}</ul></div>
    ${S.ind.startsWith("qol")?qolNotice():""}
    <div class="finder"><div class="frow"><input id="q" type="search" placeholder="지역 이름으로 순위 찾기" aria-label="지역 검색">
      <div class="seg" role="group" aria-label="기초 비교 대상">${PEERS.map(([k,l])=>`<button type="button" data-peer="${k}" aria-pressed="${S.peer===k}">${l}</button>`).join("")}</div></div>
      ${S.peer==="all"?'<p class="peerhint">팁: 군·시·자치구는 여건이 달라 지표에 따라 한쪽이 유리하게 나옵니다. 같은 유형끼리 비교하려면 위 버튼을 눌러보세요.</p>':""}
      <div class="found" id="found"></div></div>
    ${qolControls()}
    <div class="panels">
      <section class="panel mappanel"><h3>지도</h3><div class="mp"><div id="map"></div><div class="mapside" id="mapside"></div></div></section>
      ${panel(`광역 ${sidoItems.length}개 시도`,sidoItems,info,sidoName)}
      ${panel(`기초 ${sgItems.length}개 ${S.peer==="all"?"시군구":PEERS.find(x=>x[0]===S.peer)[1]}`,sgItems,info,sgName)}
    </div>
    ${methodBox()}
    <div class="card-f"><span><b>출처</b>${esc(info.source||"-")}</span>${info.note?`<span>${esc(info.note)}</span>`:""}</div>`;

  document.querySelectorAll("[data-peer]").forEach(b=>b.onclick=()=>{S.peer=b.dataset.peer;try{localStorage.setItem("lifestats-peer",S.peer)}catch(e){}if(S.cfg)computeQol();render()});
  bindQol();
  drawMap(sgItems.length?sgItems:null,sidoItems,info,sgName);

  const rs=rankList(sgItems,info.higherIsBetter), rsido=rankList(sidoItems,info.higherIsBetter);
  const pl=plain(rs.map(x=>x.v),info.unit), plS=plain(rsido.map(x=>x.v),info.unit);
  $("q").oninput=e=>{
    const q=e.target.value.trim().replace(/\s+/g," ");
    document.querySelectorAll(".full li.hit").forEach(li=>li.classList.remove("hit"));
    if(!q){$("found").innerHTML="";return}
    const hits=[
      ...rsido.filter(r=>r.k.includes(q)).map(r=>`<span><b>${esc(r.k)}</b> 시도 ${r.rank}위/${rsido.length} <em>${plS(r.v)}</em></span>`),
      ...rs.filter(r=>sgName(r).includes(q)||r.name.includes(q)).slice(0,6).map(r=>`<span><b>${esc(sgName(r))}</b> ${r.rank}위/${rs.length} <em>${pl(r.v)}</em></span>`)
    ];
    $("found").innerHTML=hits.length?hits.join(""):'<span>일치하는 지역이 없어요.</span>';
    const names=new Set(rs.filter(r=>sgName(r).includes(q)||r.name.includes(q)).map(sgName));
    document.querySelectorAll(".panel:last-child .full li").forEach(li=>{if(names.has(li.dataset.k))li.classList.add("hit")});
  };
}

/* ---- 종합 삶의 질 지수 ----
   해외 사례(OECD 지역 웰빙, 東洋経済 住みよさ, EU-SPI)를 따라: 지표를 5~95백분위로 절단한 min-max(0~100)로 바꾸고,
   분야 안에서는 단순평균, 분야끼리는 사용자 가중치로 합성한다(산술평균 또는 약점 반영 멱평균 β=0.5). */
const QKEY="lifestats-qol-v1";
function setupQol(){
  const c=S.cfg; S.w={}; S.mode="pow";
  c.dims.forEach(x=>S.w[x.id]=3);
  try{const o=JSON.parse(localStorage.getItem(QKEY)||"null");if(o){c.dims.forEach(x=>{if(o.w&&o.w[x.id]!=null)S.w[x.id]=+o.w[x.id]});if(o.mode)S.mode=o.mode}}catch(e){}
  const mk=(id,name,desc)=>({id,name,unit:"점",higherIsBetter:true,source:"종합 산출(국가데이터처·건강보험심사평가원·국토교통부 등 지표 합성)",yearSido:"지표별 최신",yearSigungu:"지표별 최신",note:desc});
  S.d.themes.push({id:"qol",name:"실험실 · 종합 삶의 질",indicators:[mk("qol",c.name+" (실험실)","분야별 점수를 가중 합성한 0~100점 지수. 아래 슬라이더로 분야 중요도를 직접 정해 보세요.")]
    .concat(c.dims.map(x=>mk("qol_"+x.id,x.name+" 점수",x.desc+" (분야 점수 0~100점)")))});
  computeQol();
}
function pctl(sorted,p){const i=(sorted.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo)}
function computeQol(){
  const d=S.d,c=S.cfg;
  const out=lv=>{
    const keys=lv==="sg"?d.regions.filter(peerOk).map(r=>r.code):d.sidos;
    const get=(id,k)=>{const m=lv==="sg"?d.values[id]:d.sidoValues[id];const v=m&&m[k];return v==null?null:v};
    const minN=lv==="sg"?Math.min(100,Math.floor(keys.length*.5)):12;
    const dimScore={}; // dim -> key -> score
    c.dims.forEach(dim=>{
      const act=[];
      dim.inds.forEach(ind=>{
        const vals=keys.map(k=>get(ind.id,k)).filter(v=>v!=null);
        if(vals.length<minN)return;
        const so=[...vals].sort((a,b)=>a-b),lo=pctl(so,.05),hi=pctl(so,.95);
        if(hi<=lo)return;
        act.push({id:ind.id,dir:ind.dir,lo,hi});
      });
      const res={};
      if(act.length){
        const need=Math.ceil(act.length*.6);
        keys.forEach(k=>{
          const ss=[];
          act.forEach(a=>{const v=get(a.id,k);if(v==null)return;let t=(Math.min(Math.max(v,a.lo),a.hi)-a.lo)/(a.hi-a.lo)*100;if(a.dir<0)t=100-t;ss.push(t)});
          if(ss.length>=need)res[k]=ss.reduce((x,y)=>x+y,0)/ss.length;
        });
      }
      dimScore[dim.id]={res,active:act.length>0};
    });
    const total=c.dims.filter(x=>dimScore[x.id].active).reduce((a,x)=>a+S.w[x.id],0);
    const comp={};
    keys.forEach(k=>{
      let sw=0,sa=0;
      c.dims.forEach(x=>{const w=S.w[x.id],v=dimScore[x.id].res[k];if(w>0&&v!=null){sw+=w;sa+=w*(S.mode==="pow"?Math.sqrt(v):v)}});
      if(sw>0&&total>0&&sw>=.6*total){const m=sa/sw;comp[k]=+((S.mode==="pow"?m*m:m).toFixed(1))}
    });
    const r={qol:comp};
    c.dims.forEach(x=>{r["qol_"+x.id]=Object.fromEntries(Object.entries(dimScore[x.id].res).map(([k,v])=>[k,+v.toFixed(1)]))});
    return r;
  };
  const sg=out("sg"),sd=out("sd");
  Object.keys(sg).forEach(id=>{d.values[id]=sg[id];d.sidoValues[id]=sd[id]});
  // 종합·분야 점수는 비교집단 안에서만 값이 있으므로, 집단 밖 지역은 자연히 제외된다
}
/* 가중치: 정칠각형(분야 7개) 레이더 위에서 손가락·마우스로 꼭짓점을 끌어 0~5를 정한다 */
const RAD={C:210,R:150,max:5},VB={x:-75,y:-22,w:570,h:468};
function radAxis(i,n){const a=-Math.PI/2+i*2*Math.PI/n;return [Math.cos(a),Math.sin(a)]}
function radPt(i,n,v){const [x,y]=radAxis(i,n),r=RAD.R*v/RAD.max;return [RAD.C+x*r,RAD.C+y*r]}
function radarSVG(){
  const dims=S.cfg.dims,n=dims.length,C=RAD.C;
  const ring=v=>dims.map((_,i)=>radPt(i,n,v).map(z=>z.toFixed(1)).join(",")).join(" ");
  const grid=[1,2,3,4,5].map(v=>`<polygon points="${ring(v)}" class="rg${v===5?" rg5":""}"/>`).join("");
  const axes=dims.map((_,i)=>{const [x,y]=radPt(i,n,5);return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="ax"/>`}).join("");

function bindQol(){
  if(S.ind!=="qol"||!S.cfg)return;
  const save=()=>{try{localStorage.setItem(QKEY,JSON.stringify({w:S.w,mode:S.mode}))}catch(e){}};
  const commit=()=>{save();computeQol();render()};
  $("qmode").onchange=e=>{S.mode=e.target.value;commit()};
  $("qreset").onclick=()=>{S.cfg.dims.forEach(x=>S.w[x.id]=3);S.mode="pow";commit()};
  const svg=$("radar"),dims=S.cfg.dims,n=dims.length;
  let axis=-1,changed=false;
  const local=e=>{const r=svg.getBoundingClientRect();return [VB.x+(e.clientX-r.left)/r.width*VB.w,VB.y+(e.clientY-r.top)/r.height*VB.h]};
  const setFrom=(x,y)=>{
    const [ux,uy]=radAxis(axis,n),t=((x-RAD.C)*ux+(y-RAD.C)*uy)/RAD.R*RAD.max;
    const v=Math.max(0,Math.min(RAD.max,Math.round(t))),d=dims[axis];
    if(S.w[d.id]===v)return; S.w[d.id]=v; changed=true;
    const [hx,hy]=radPt(axis,n,v); const h=$("rh-"+d.id); h.setAttribute("cx",hx.toFixed(1)); h.setAttribute("cy",hy.toFixed(1));
    $("rpoly").setAttribute("points",dims.map((q,i)=>radPt(i,n,S.w[q.id]).map(z=>z.toFixed(1)).join(",")).join(" "));
    $("rl-"+d.id).textContent=v; $("qv-"+d.id).textContent=v;
  };
  svg.addEventListener("pointerdown",e=>{
    const [x,y]=local(e),dx=x-RAD.C,dy=y-RAD.C;
    if(Math.hypot(dx,dy)>RAD.R+40)return;
    // 누른 방향과 가장 가까운 축을 고른다
    let best=0,bd=-2;dims.forEach((_,i)=>{const [ux,uy]=radAxis(i,n),c=(dx*ux+dy*uy)/(Math.hypot(dx,dy)||1);if(c>bd){bd=c;best=i}});
    axis=best;changed=false;svg.setPointerCapture(e.pointerId);
    svg.querySelectorAll(".hd").forEach(h=>h.classList.remove("on"));$("rh-"+dims[axis].id).classList.add("on");
    setFrom(x,y);e.preventDefault();
  });
  svg.addEventListener("pointermove",e=>{if(axis<0)return;const [x,y]=local(e);setFrom(x,y)});
  const end=()=>{if(axis<0)return;axis=-1;if(changed)commit();else svg.querySelectorAll(".hd").forEach(h=>h.classList.remove("on"))};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
}

const GEO={};
async function geo(kind){
  if(!GEO[kind]){
    const g=await fetch(`data/geo_${kind}.json`).then(r=>r.json());
    const KX=80,KY=100,SHIFT=1.15; // 울릉도·독도(경도 130.5 이동)는 왼쪽으로 옮겨 삽입도로 그린다
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,ix0=1e9,ix1=-1e9,iy0=1e9,iy1=-1e9;
    const feats=g.features.map(f=>{
      const polys=f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates;
      const rings=polys.map(poly=>{
        const inset=Math.min(...poly[0].map(c=>c[0]))>130.5;
        return poly.map(r=>r.map(([x,y])=>{const X=(inset?x-SHIFT:x)*KX,Y=-y*KY;
          if(inset){ix0=Math.min(ix0,X);ix1=Math.max(ix1,X);iy0=Math.min(iy0,Y);iy1=Math.max(iy1,Y)}
          x0=Math.min(x0,X);x1=Math.max(x1,X);y0=Math.min(y0,Y);y1=Math.max(y1,Y);return [X,Y]}));
      });
      return {k:f.properties.k,rings};
    });
    const P=14,fx=v=>(v-x0+P).toFixed(1),fy=v=>(v-y0+P).toFixed(1);
    GEO[kind]={w:(x1-x0+2*P).toFixed(0),h:(y1-y0+2*P).toFixed(0),
      inset:ix0<1e9?{x:fx(ix0-10),y:fy(iy0-10),w:(ix1-ix0+20).toFixed(0),h:(iy1-iy0+20).toFixed(0)}:null,
      paths:feats.map(f=>({k:f.k,d:f.rings.map(p=>p.map(r=>"M"+r.map(([X,Y])=>fx(X)+" "+fy(Y)).join("L")+"Z").join("")).join("")}))};
  }
  return GEO[kind];
}

    <div class="zoom" role="group" aria-label="지도 확대·축소"><button type="button" data-z="in" aria-label="확대">+</button><button type="button" data-z="out" aria-label="축소">−</button><button type="button" data-z="reset" aria-label="전체 보기" title="전체 보기">⟲</button></div>

    if(!t){tip.hidden=true;return}
    const k=t.dataset.k,r=byKey.get(k),pp=popOf(k);
    tip.innerHTML=`<b>${esc(nameOfKey(k))}</b>${pp!=null?`<span>인구 ${fmtPop(pp)}${P.year?` <small>(${esc(P.year)})</small>`:""}</span>`:""}${r?`<span class="tv">${pl(r.v)} · ${r.rank}위/${n}</span>`:'<span class="tv">자료 없음</span>'}`;
    tip.hidden=false;
    const br=box.getBoundingClientRect(); let x=e.clientX-br.left+14, y=e.clientY-br.top+14;
    if(x+tip.offsetWidth>br.width-4)x=e.clientX-br.left-tip.offsetWidth-12;
    if(y+tip.offsetHeight>br.height-4)y=e.clientY-br.top-tip.offsetHeight-12;
    tip.style.left=x+"px";tip.style.top=y+"px";
  });
  svg.addEventListener("pointerleave",()=>{tip.hidden=true});
  const show=k=>{
    const r=byKey.get(k),pp=popOf(k),pop=pp!=null?`<p>인구 <b>${fmtPop(pp)}</b>${P.year?` (${esc(P.year)})`:""}</p>`:"";
    side.innerHTML=r?`<div class="big">${esc(label(k))}</div>${pop}<p>${n}곳 중 <b>${r.rank}위</b></p><div class="big">${pl(r.v)}</div><p>${info.unit&&info.unit.length>2?esc(info.unit):""}</p>`
      :`<div class="big">${esc(nameOfKey(k))}</div>${pop}<p>이 지표는 자료가 없어요.</p>`;
    el.querySelectorAll("path.sel").forEach(x=>x.classList.remove("sel"));
    const t=[...el.querySelectorAll("path")].find(x=>x.dataset.k===k); if(t) t.classList.add("sel");
  };
  el.querySelectorAll("path").forEach(p=>{p.onmouseenter=()=>{if(!start||!moved)show(p.dataset.k)};p.onclick=()=>{if(!moved)show(p.dataset.k)}});
  side.innerHTML=`<p>${useSg?"시군구":"시도"} 단위 지도입니다. ${useSg?"":"이 지표는 시도 단위만 공표돼요. "}지역을 누르거나, + 버튼으로 확대해 보세요.</p>`;
  apply();
}
</script>
</body>
</html>
