<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험실2 · 소득·자산 분석 — 클사무관의 Global Stats</title>
<meta name="description" content="연령대별 가구 평균 소득·자산의 연도별 변화 (KOSIS 가계금융복지조사, 2010–2025)">
<link rel="icon" href="../assets/brand/favicon.svg"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<style>
:root{--bg:#eaf6f3;--fg:#1d2a3a;--mut:#4f5f6f;--line:#d9ece7;--card:#fff;--teal:#2bb8a0;--deep:#0f7a68;color-scheme:light}
*{box-sizing:border-box}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.5 -apple-system,"Noto Sans KR","Pretendard",sans-serif}
a{color:inherit}
.hd{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.hd img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--teal);flex:none}
.hd>div{min-width:0}
.hd b{font-size:30px;font-weight:800;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd b em{font-style:normal;color:var(--deep)}
.hd span{color:var(--mut);font-size:16px}
.hd a.back{margin-left:auto;flex:none;font-size:16px;font-weight:700;color:var(--deep);text-decoration:none;border:2px solid var(--teal);border-radius:999px;padding:6px 14px;background:#fff;white-space:nowrap}
.hd a.back .s{display:none}
.shell{display:flex;gap:22px;max-width:1500px;margin:0 auto;padding:20px 16px;align-items:flex-start}
#nav{width:310px;flex:none;position:sticky;top:96px;background:#fff;border:3px solid var(--teal);border-radius:24px;padding:12px 10px}
#nav h3{margin:4px 8px 6px;font-size:21px;font-weight:800;color:var(--deep)}
#nav button{display:block;width:100%;text-align:left;font:inherit;font-size:19px;font-weight:600;padding:9px 14px;margin:2px 0;border:0;border-radius:12px;background:transparent;color:var(--fg);cursor:pointer}
#nav button:hover{background:#e3f5f1}
#nav button.on{background:var(--teal);color:#fff;font-weight:800;box-shadow:0 3px 10px rgba(43,184,160,.4)}
#nav .note{font-size:14px;color:var(--mut);line-height:1.45;padding:6px 14px 4px}
main{flex:1;min-width:0}
.card{background:var(--card);border:6px solid var(--teal);border-radius:36px;padding:22px 28px 20px}
.top{display:flex;justify-content:flex-end}
.ttl{text-align:right}
.ttl h1{font-size:38px;margin:0;font-weight:800;line-height:1.2}
.sub{color:var(--mut);font-size:17px}
.chip{display:inline-block;background:#dff4ef;color:var(--deep);font-weight:800;font-size:17px;border-radius:999px;padding:3px 14px;margin-bottom:4px}
.box{margin-top:6px;position:relative}
#chart{width:100%;height:auto;display:block}
.ax{fill:var(--mut);font-size:19px}
.grid{stroke:var(--line);stroke-width:1.5}
.minor{stroke:var(--line);stroke-width:.8;opacity:.8}
.axt{fill:var(--fg);font-weight:800;font-size:23px}
.axt .p{font-weight:500;font-size:.7em;fill:var(--mut)}
#yearbig{font-size:170px;font-weight:800;fill:#bfe9e0;pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:-4px}
circle.b{stroke-width:1.5;cursor:pointer}
.lab{font-size:19px;font-weight:700;fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px}
.bsz{font-size:13px;font-weight:700;fill:var(--mut);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;align-items:end}
.stats .l{color:var(--mut);font-size:17px;font-weight:600}
.stats .v{font-size:46px;font-weight:800;line-height:1.1;white-space:nowrap}
.v.t{color:var(--deep)}
.r{text-align:right}
.row{display:flex;align-items:center;gap:18px;margin-top:12px}
#play{width:64px;height:64px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:26px;cursor:pointer;flex:none}
input[type=range]{flex:1;min-width:0;height:12px;accent-color:var(--teal)}
#spd{display:flex;gap:5px;flex:none}
#spd button{font:inherit;font-size:14px;font-weight:700;padding:4px 10px;border:2px solid var(--teal);border-radius:999px;background:#fff;color:var(--deep);cursor:pointer}
#spd button.on{background:var(--teal);color:#fff}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:18px;color:var(--mut);margin-top:10px}
.leg i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:6px;vertical-align:-2px}
#tip{position:fixed;pointer-events:none;background:#fff;border:2px solid var(--teal);border-radius:14px;padding:6px 10px;font-size:15px;line-height:1.45;display:none;z-index:20}
.src{font-size:15px;color:var(--mut);margin-top:10px;line-height:1.5}
.warn{font-size:14px;color:#8a5a00;background:#fff7ec;border:1.5px solid #f4c58a;border-radius:12px;padding:8px 12px;margin-top:12px;line-height:1.5}
footer{margin-top:18px;font-size:15px;color:var(--mut);text-align:center}
footer img{height:48px;width:auto;max-width:100%}
#msg{color:var(--mut);padding:60px 10px;text-align:center}

/* 태블릿 */
@media(max-width:900px){
  .shell{display:block;padding:12px}
  #nav{position:static;width:auto;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-width:2px;border-radius:18px}
  #nav h3{margin:0 4px;font-size:16px}
  #nav button{width:auto;font-size:15px;padding:5px 12px;margin:0}
  #nav .note{display:none}
  .hd{padding:10px 16px}
  .hd b{font-size:22px}.hd span{display:none}.hd img{width:44px;height:44px}
}
/* 모바일: 별도 크기 */
@media(max-width:640px){
  body{font-size:15px}
  .hd{padding:8px 10px;gap:8px}
  .hd img{width:34px;height:34px;border-width:2px}
  .hd b{font-size:clamp(14px,4.4vw,18px)}
  .hd a.back{font-size:13px;padding:4px 10px;border-width:1.5px}
  .hd a.back .l{display:none}.hd a.back .s{display:inline}
  .shell{padding:8px}
  .card{padding:12px 10px 12px;border-width:3px;border-radius:20px}
  .top{justify-content:flex-start}
  .ttl{text-align:left}
  .chip{font-size:12px;padding:1px 10px;margin-bottom:2px}
  .ttl h1{font-size:20px}
  .sub{font-size:12px;line-height:1.4}
  .ax{font-size:10.5px}
  .axt{font-size:12px}
  #yearbig{font-size:64px;letter-spacing:-2px}
  .lab{font-size:11px;stroke-width:3px}
  .bsz{font-size:9.5px;stroke-width:2.5px}
  .stats{gap:8px;margin-top:10px}
  .stats .l{font-size:12px;line-height:1.3}
  .stats .v{font-size:24px}
  .row{gap:8px;margin-top:10px}
  #play{width:42px;height:42px;font-size:17px}
  #spd{gap:3px}
  #spd button{font-size:11.5px;padding:2px 7px;border-width:1.5px}
  .leg{font-size:12.5px;gap:4px 12px;margin-top:8px}
  .leg i{width:11px;height:11px;margin-right:4px;vertical-align:-1px}
  .src{font-size:11.5px}
  .warn{font-size:11.5px;padding:6px 9px;border-radius:10px}
  footer img{height:36px}
  #tip{font-size:12px;padding:4px 8px;border-radius:10px}
}
</style></head>
<body>
<header class="hd">
  <img src="../assets/clerk.jpg" alt="클사무관">
  <div><b>클사무관의 <em>Global Stats</em></b><span>실험실2 · 소득·자산 분석</span></div>
  <a class="back" href="../" aria-label="라이프 인덱스로 돌아가기"><span class="l">← 라이프 인덱스</span><span class="s">← 홈</span></a>
</header>

<div class="shell">
  <nav id="nav" aria-label="실험실2 목록">
    <h3>🧪 실험실2</h3>
    <button type="button" class="on" aria-current="true">연령대별 소득·자산</button>
    <div class="note">가구주 연령계층(10세) 기준 전가구 평균. 버블 위치 = 평균 소득(가로) · 평균 자산(세로), 크기 = 가구 비중.</div>
  </nav>

  <main>
    <div class="card">
      <div class="top">
        <div class="ttl">
          <div class="chip">2010–2025 · KOSIS</div>
          <h1>연령대별 소득 · 자산</h1>
          <div class="sub">X: 평균 소득(전년도 경상소득) · Y: 평균 자산 · 크기: 가구 비중 · 색: 연령대</div>
        </div>
      </div>

      <div class="box">
        <div id="msg" hidden></div>
        <svg id="chart" viewBox="0 0 960 600" role="img" aria-label="연령대별 소득·자산 버블 차트">
          <g id="grid"></g>
          <g id="axes"></g>
          <text id="yearbig" x="0" y="0" text-anchor="end"></text>
          <g id="bubbles"></g>
          <g id="labels"></g>
        </svg>
      </div>

      <div class="stats">
        <div><div class="l" id="l1">선택 연령대 평균 소득</div><div class="v" id="v1">—</div></div>
        <div class="r"><div class="l" id="l2">선택 연령대 평균 자산</div><div class="v t" id="v2">—</div></div>
      </div>

      <div class="row">
        <button id="play" type="button" aria-label="재생">▶</button>
        <input id="yr" type="range" aria-label="연도">
        <div id="spd" role="group" aria-label="재생 속도">
          <button type="button" data-s="0.5">0.5×</button><button type="button" data-s="1" class="on">1×</button><button type="button" data-s="2">2×</button>
        </div>
      </div>

      <div class="leg" id="leg"></div>

      <div class="src" id="src"></div>
      <div class="warn" id="warn"></div>
    </div>

    <footer>
      <a href="https://github.com/lloydknam" target="_blank" rel="noopener"><img src="../assets/brand/lockup-light.svg" alt="Lloyd's Balcony Lab · with claude · GitHub(@lloydknam)"></a>
    </footer>
  </main>
</div>

<div id="tip"></div>

<script>
const COL = { "20대 이하": "#a9cdf7", "30대": "#a8e3c8", "40대": "#fde0a8", "50대": "#f9b8c8", "60세 이상": "#d8c4f4" };
const $ = (s) => document.getElementById(s);
const NS = "http://www.w3.org/2000/svg";
const fmtMan = (v) => v == null ? "–" : (v >= 10000 ? (v / 10000).toFixed(2) + "억" : Math.round(v).toLocaleString("ko-KR") + "만");
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const lerp = (a, b, t) => a + (b - a) * t;

let D = null, years = [], groups = [], pos = 0, sel = 0, raf = null, playing = false, speed = 1;
let MOB = false, W = 960, H = 600, M = { l: 96, r: 20, t: 16, b: 62 }, pw = 0, ph = 0;
let X, Y, R, xMax = 1, yMax = 1, hMax = 1, circles = [], labelEls = [], shareEls = [];

fetch("../data/household_age.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(() => { $("msg").hidden = false; $("msg").textContent = "데이터를 불러오지 못했습니다."; });

function init(data) {
  D = data;
  years = data.years;
  groups = data.groups.filter((g) => Object.keys(g.data).length);
  const all = groups.flatMap((g) => Object.values(g.data));
  xMax = Math.ceil(Math.max(...all.map((d) => d.income)) * 1.08 / 2000) * 2000;
  yMax = Math.ceil(Math.max(...all.map((d) => d.asset)) * 1.08 / 10000) * 10000;
  hMax = Math.max(...all.map((d) => d.share || 0), 1);

  buildLegend();
  $("src").textContent = `출처: ${data.source} · 단위: ${data.unit}`;
  $("warn").textContent = "⚠️ " + data.note + " 2010~11년 연령 구간 '30세 미만'은 '20대 이하'로 맞췄습니다.";
  const yr = $("yr");
  yr.min = 0; yr.max = years.length - 1; yr.step = 0.01;
  yr.addEventListener("input", () => { stop(); setPos(+yr.value); });
  pos = years.length - 1;
  layout();
  bindControls();

  let lastW = window.innerWidth, t = null;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(() => { if (Math.abs(window.innerWidth - lastW) > 20) { lastW = window.innerWidth; layout(); } }, 150);
  });
}

// 화면 크기에 따라 SVG 좌표계를 따로 잡음: 모바일은 실제 픽셀 폭에 맞춰 글자가 작아지지 않게
function layout() {
  MOB = window.innerWidth <= 640;
  if (MOB) {
    W = Math.max(300, Math.round($("chart").parentNode.clientWidth));
    H = Math.round(W * 1.05);
    M = { l: 40, r: 8, t: 10, b: 40 };
  } else {
    W = 960; H = 600; M = { l: 96, r: 20, t: 16, b: 62 };
  }
  pw = W - M.l - M.r; ph = H - M.t - M.b;
  $("chart").setAttribute("viewBox", `0 0 ${W} ${H}`);
  X = (v) => M.l + (v / xMax) * pw;
  Y = (v) => M.t + ph - (v / yMax) * ph;
  R = MOB
    ? (h) => 1.2 * (7 + 26 * Math.sqrt((h || 0) / hMax))
    : (h) => 1.2 * (14 + 52 * Math.sqrt((h || 0) / hMax));
  ["grid", "axes", "bubbles", "labels"].forEach((id) => $(id).replaceChildren());
  drawAxes();
  buildBubbles();
  render();
}

const yLabel = (n) => n === 0 ? "0" : MOB ? n + "억" : n + "억원";
const xLabel = (v) => {
  if (v === 0) return "0";
  if (!MOB) return v >= 10000 ? (v / 10000) + "억원" : v.toLocaleString("ko-KR") + "만원";
  return v >= 10000 ? (v / 10000) + "억" : (v / 1000) + "천만";
};

function drawAxes() {
  const grid = $("grid"), axes = $("axes");
  for (let v = 5000; v < yMax; v += 10000) el("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), class: "minor" }, grid);
  for (let v = 1000; v < xMax; v += 2000) el("line", { x1: X(v), x2: X(v), y1: M.t, y2: M.t + ph, class: "minor" }, grid);
  const yo = MOB ? 4 : 6;
  for (let v = 0; v <= yMax + 1e-9; v += 10000) {
    const y = Y(v);
    el("line", { x1: M.l, x2: W - M.r, y1: y, y2: y, class: "grid" }, grid);
    el("text", { x: M.l - (MOB ? 5 : 10), y: y + yo, "text-anchor": "end", class: "ax" }, axes).textContent = yLabel(v / 10000);
  }
  for (let v = 0; v <= xMax + 1e-9; v += 2000) {
    const x = X(v);
    el("line", { x1: x, x2: x, y1: M.t, y2: M.t + ph, class: "grid" }, grid);
    const lastTick = v + 2000 > xMax + 1e-9;
    el("text", { x: lastTick ? x + 2 : x, y: M.t + ph + (MOB ? 14 : 30), "text-anchor": lastTick ? "end" : "middle", class: "ax" }, axes).textContent = xLabel(v);
  }
  el("text", { x: M.l + pw / 2, y: H - (MOB ? 6 : 4), "text-anchor": "middle", class: "axt" }, axes).innerHTML =
    MOB ? `평균 소득 →` : `평균 소득 <tspan class="p">(전년도 경상소득)</tspan> →`;
  const ay = M.t + ph / 2, axx = MOB ? 10 : 22;
  el("text", { x: axx, y: ay, transform: `rotate(-90 ${axx} ${ay})`, "text-anchor": "middle", class: "axt" }, axes).textContent = "평균 자산 →";
  const yb = $("yearbig");
  yb.setAttribute("x", W - M.r - (MOB ? 6 : 16));
  yb.setAttribute("y", M.t + ph - (MOB ? 8 : 18));
}

function buildLegend() {
  const leg = $("leg");
  leg.replaceChildren();
  groups.forEach((g) => {
    const s = document.createElement("span");
    const i = document.createElement("i");
    i.style.background = COL[g.label] || "#ccc";
    s.appendChild(i);
    s.appendChild(document.createTextNode(g.label));
    leg.appendChild(s);
  });
}

function buildBubbles() {
  const bg = $("bubbles"), lg = $("labels");
  circles = groups.map((g, i) => {
    const c = el("circle", { r: 0, fill: COL[g.label] || "#ccc", "fill-opacity": ".5", stroke: COL[g.label] || "#ccc", "stroke-opacity": ".9", class: "b" }, bg);
    c.addEventListener("mouseenter", (e) => showTip(i, e));
    c.addEventListener("mousemove", (e) => moveTip(e));
    c.addEventListener("mouseleave", () => ($("tip").style.display = "none"));
    c.addEventListener("click", (e) => { sel = i; render(); showTip(i, e); });
    return c;
  });
  labelEls = groups.map(() => el("text", { class: "lab", "text-anchor": "middle" }, lg));
  shareEls = groups.map(() => el("text", { class: "bsz", "text-anchor": "middle" }, lg));
}

// 연속 위치(pos: 실수 연도 인덱스) → 두 해 사이 직선 보간
function valueAt(g, p) {
  const i = Math.floor(p), f = p - i;
  const a = g.data[years[i]], b = g.data[years[Math.min(i + 1, years.length - 1)]];
  if (!a) return null;
  if (!b || f === 0) return a;
  return {
    income: lerp(a.income, b.income, f),
    asset: lerp(a.asset, b.asset, f),
    share: a.share != null && b.share != null ? lerp(a.share, b.share, f) : a.share,
  };
}

function setPos(p) {
  pos = Math.max(0, Math.min(years.length - 1, p));
  render();
}

function render() {
  if (!circles.length) return;
  const yi = Math.round(pos);
  $("yearbig").textContent = years[yi];
  $("yr").value = pos;
  const nameDy = MOB ? -1 : -2, shareDy = MOB ? 11 : 17;
  const pts = [];
  groups.forEach((g, i) => {
    const d = valueAt(g, pos), c = circles[i], t = labelEls[i], sz = shareEls[i];
    if (!d) { c.setAttribute("r", 0); t.textContent = ""; sz.textContent = ""; return; }
    const cx = X(d.income), cy = Y(d.asset), r = R(d.share);
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
    pts.push({ i, cx, cy, r, ly: cy, share: d.share || 0, label: g.label, txt: d.share != null ? d.share.toFixed(1) + "%" : "" });
  });
  const lw = MOB ? 52 : 80, lh = MOB ? 26 : 38;
  pts.sort((a, b) => b.share - a.share);
  const placed = [];
  for (const p of pts) {
    const hit = placed.some((q) => Math.abs(q.cx - p.cx) < lw && Math.abs(q.ly - p.ly) < lh);
    if (hit) p.ly = p.cy + p.r + (MOB ? 12 : 18);   // 버블 아래쪽 바깥으로
    placed.push(p);
  }
  for (const p of pts) {
    const t = labelEls[p.i], sz = shareEls[p.i];
    t.setAttribute("x", p.cx); t.setAttribute("y", p.ly + nameDy); t.textContent = p.label;
    sz.setAttribute("x", p.cx); sz.setAttribute("y", p.ly + shareDy); sz.textContent = p.txt;
  }
  const g = groups[sel], d = g && valueAt(g, pos), y = years[yi];
  $("l1").textContent = `${g ? g.label : ""} 평균 소득 (${y})`;
  $("l2").textContent = `${g ? g.label : ""} 평균 자산 (${y})`;
  $("v1").textContent = d ? fmtMan(d.income) : "–";
  $("v2").textContent = d ? fmtMan(d.asset) : "–";
}

function showTip(i, e) {
  const g = groups[i], d = valueAt(g, pos);
  if (!d) return;
  const tip = $("tip");
  tip.innerHTML = `<b>${g.label}</b> · ${years[Math.round(pos)]}<br>소득 ${fmtMan(d.income)} · 자산 ${fmtMan(d.asset)}<br>가구 비중 ${d.share != null ? d.share.toFixed(1) + "%" : "–"}`;
  tip.style.display = "block";
  moveTip(e);
}
function moveTip(e) {
  const tip = $("tip");
  const w = tip.offsetWidth || 160;
  const x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = (e.clientY + 12) + "px";
}
document.addEventListener("touchstart", (e) => { if (!(e.target instanceof SVGCircleElement)) $("tip").style.display = "none"; }, { passive: true });

// 재생: 연도당 약 1초, 프레임마다 실수 위치를 올려 부드럽게 이동
let last = 0;
function frame(ts) {
  if (!playing) return;
  if (!last) last = ts;
  const dt = (ts - last) / 1000;
  last = ts;
  const next = pos + dt * speed;
  if (next >= years.length - 1) { setPos(years.length - 1); stop(); return; }
  setPos(next);
  raf = requestAnimationFrame(frame);
}
function stop() {
  playing = false; last = 0;
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  $("play").textContent = "▶";
}
function start() {
  if (pos >= years.length - 1) setPos(0);
  playing = true; last = 0;
  $("play").textContent = "⏸";
  raf = requestAnimationFrame(frame);
}

function bindControls() {
  $("play").addEventListener("click", () => (playing ? stop() : start()));
  document.querySelectorAll("#spd button").forEach((b) => b.addEventListener("click", () => {
    speed = +b.dataset.s;
    document.querySelectorAll("#spd button").forEach((x) => x.classList.toggle("on", x === b));
  }));
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { stop(); setPos(Math.round(pos) - 1); }
    if (e.key === "ArrowRight") { stop(); setPos(Math.round(pos) + 1); }
  });
}
</script>
