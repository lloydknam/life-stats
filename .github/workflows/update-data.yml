name: update-data
on:
  schedule:
    - cron: "0 21 * * 0"   # 매주 월요일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KOSIS data
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python scripts/fetch_kosis.py
      - name: Fetch 실거래가 (공공데이터포털)
        continue-on-error: true
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_realestate.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json data/fetch_report.txt data/realestate_report.txt
          git diff --staged --quiet || git commit -m "data: update $(date +%F)"
          git pull --rebase -q origin main
          git push
