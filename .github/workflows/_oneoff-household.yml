name: _oneoff-household
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover household survey tables
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python scripts/_oneoff/discover_household.py
      - name: Push output to branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan out-branch
          git rm -rf -q . || true
          mkdir -p out && git add -f out/
          git commit -q -m "oneoff household output"
          git push -f origin HEAD:refs/heads/oneoff/household-out
